<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Moda & Estilo</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="pagina-acceso">

    <div class="tarjeta-acceso">

        <h1>Moda & Estilo</h1>
        <h2>Crear una cuenta</h2>
        <p class="subtitulo">Regístrate para comenzar a comprar</p>

        <form action="InicioSesion.html" method="GET">

            <div class="grupo-formulario">
                <label for="nombre">Nombre completo</label>
                <input 
                    type="text" 
                    id="nombre" 
                    name="nombre"
                    placeholder="Ingresa tu nombre"
                    required
                >
            </div>

            <div class="grupo-formulario">
                <label for="correo">Correo electrónico</label>
                <input 
                    type="email" 
                    id="correo" 
                    name="correo"
                    placeholder="ejemplo@gmail.com"
                    required
                >
            </div>

            <div class="grupo-formulario">
                <label for="telefono">Teléfono</label>
                <input 
                    type="tel" 
                    id="telefono" 
                    name="telefono"
                    placeholder="987 654 321"
                >
            </div>

            <div class="grupo-formulario">
                <label for="direccion">Dirección</label>
                <input 
                    type="text" 
                    id="direccion" 
                    name="direccion"
                    placeholder="Ingresa tu dirección"
                >
            </div>

            <div class="grupo-formulario">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="Crea una contraseña"
                    required
                >
            </div>

            <div class="grupo-formulario">
                <label for="confirmar">Confirmar contraseña</label>
                <input 
                    type="password" 
                    id="confirmar" 
                    name="confirmar"
                    placeholder="Repite tu contraseña"
                    required
                >
            </div>

            <button type="submit" class="boton-acceso">
                Crear cuenta
            </button>

        </form>

        <p class="cambiar-pagina">
            ¿Ya tienes una cuenta?
            <a href="InicioSesion.html">Iniciar sesión</a>
        </p>

        <a href="PaginaPrincipal.html" class="volver">
            &larr; Volver a la página principal
        </a>

    </div>

</body>

</html>
