<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Moda & Estilo</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="pagina-acceso">

    <div class="tarjeta-acceso">

        <h1>Moda & Estilo</h1>
        <h2>Iniciar sesión</h2>
        <p class="subtitulo">Ingresa a tu cuenta para continuar</p>

        <form action="PaginaPrincipal.html" method="GET">

            <div class="grupo-formulario">
                <label for="correo">Correo electrónico</label>
                <input 
                    type="email" 
                    id="correo" 
                    name="correo"
                    placeholder="ejemplo@gmail.com"
                    required
                >
            </div>

            <div class="grupo-formulario">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >
            </div>

            <button type="submit" class="boton-acceso">
                Iniciar sesión
            </button>

        </form>

        <p class="cambiar-pagina">
            ¿No tienes una cuenta?
            <a href="Registro.html">Registrarse</a>
        </p>

        <a href="PaginaPrincipal.html" class="volver">
            &larr; Volver a la página principal
        </a>

    </div>

</body>

</html>
