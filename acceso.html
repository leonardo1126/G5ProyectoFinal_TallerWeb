<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Mi Tienda</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <h1>Mi Tienda</h1>

        <a href="index.html">
            Volver al inicio
        </a>
    </header>

    <main>

        <!-- INICIO DE SESIÓN -->
        <section>
            <h2>Iniciar sesión</h2>

            <form>
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">
                    Iniciar sesión
                </button>
            </form>
        </section>

        <hr>

        <!-- REGISTRO -->
        <section>
            <h2>Crear una cuenta</h2>

            <form>
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="correoRegistro">Correo electrónico:</label>
                <input type="email" id="correoRegistro" name="correoRegistro" required>

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono">

                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" name="direccion">

                <label for="passwordRegistro">Contraseña:</label>
                <input type="password" id="passwordRegistro" name="passwordRegistro" required>

                <label for="confirmarPassword">Confirmar contraseña:</label>
                <input type="password" id="confirmarPassword" name="confirmarPassword" required>

                <button type="submit">
                    Registrarse
                </button>
            </form>
        </section>

    </main>

</body>

</html>
